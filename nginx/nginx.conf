# Docker/独立 Nginx 使用的完整配置（可选部署方式）
# 生产裸机仍推荐 nginx/hotel-saas.conf + 系统 Nginx + systemd。

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    server {
        listen 80;
        server_name _;
        client_max_body_size 60m;
        charset utf-8;

        location / {
            root /srv/hotel-saas/portal;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location ^~ /admin/ {
            alias /srv/hotel-saas/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location /uploads/ {
            proxy_pass http://127.0.0.1:8080/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            expires 7d;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
            root /srv/hotel-saas/portal;
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        access_log /var/log/nginx/hotel-saas.access.log;
        error_log /var/log/nginx/hotel-saas.error.log warn;
    }
}
