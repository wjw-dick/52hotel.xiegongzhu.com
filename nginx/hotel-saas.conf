# 云宿 SaaS Nginx 配置（生产：Nginx 反向代理 + 静态资源）
# 使用方式：
#   1. 将本文件放到 /etc/nginx/conf.d/hotel-saas.conf（或 include 到 http 块）
#   2. 将 __PROJECT_ROOT__ 替换为项目绝对路径，例如 /home/ai/52hotel.xiegongzhu.com
#   3. 确保日志目录存在（默认 /var/log/nginx；宝塔通常为 /www/wwwlogs），按需修改下方 access_log/error_log
#   4. nginx -t && systemctl reload nginx
# 若使用 HTTPS，请补充 443 server 块并将 80 跳转到 443。

server {
    listen 80;
    server_name _;

    client_max_body_size 60m;
    charset utf-8;

    # H5 门户（portal-web 构建产物，base=/）
    location / {
        root __PROJECT_ROOT__/portal-web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # PC 管理后台（admin-web 构建产物，base=/admin/）
    location ^~ /admin/ {
        alias __PROJECT_ROOT__/admin-web/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 上传文件（本地存储驱动）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
        root __PROJECT_ROOT__/portal-web/dist;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri @fallback;
    }

    location @fallback {
        proxy_pass http://127.0.0.1:8080;
    }

    access_log /var/log/nginx/hotel-saas.access.log;
    error_log  /var/log/nginx/hotel-saas.error.log warn;

    # 安全响应头（按需调整）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
